<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title data-i18n="popupTitle">2FA 验证助手</title>
		<link rel="icon" type="image/png" href="icons/icon-32.png" />
		<link rel="stylesheet" href="theme.css" />
		<link rel="stylesheet" href="popup.css" />
		<link rel="stylesheet" href="controls.css" />
	</head>
	<body>
		<div class="popup-viewport">
			<header class="topbar">
				<img class="brand-mark" src="icons/icon-48.png" alt="" aria-hidden="true" />
				<div class="brand-text">
					<h1 data-i18n="popupTitle">2FA 验证助手</h1>
					<p id="target-origin" class="target-origin" aria-live="polite" hidden></p>
				</div>
				<nav class="topbar-actions" aria-label="项目、2FA 与设置" data-i18n-aria-label="popupNavigation">
					<a
						class="quiet-button"
						href="https://github.com/wuzf/2fa"
						target="_blank"
						rel="noopener noreferrer"
						aria-label="GitHub 项目 · wuzf/2fa"
						data-i18n-aria-label="popupProject"
						title="https://github.com/wuzf/2fa"
						>GitHub</a
					>
					<a id="instance-link" class="quiet-button" target="_blank" rel="noopener noreferrer" hidden>2FA</a>
					<button id="open-options" class="quiet-button" type="button" data-i18n="popupSettings">设置</button>
				</nav>
			</header>

			<main>
				<div id="status" class="status" role="status" aria-live="polite" hidden></div>
				<section id="setup-guide" class="setup-guide" aria-labelledby="setup-heading" hidden>
					<h2 id="setup-heading" data-i18n="popupSetupHeading">还没有 2FA 实例？</h2>
					<p data-i18n="popupSetupDescription">本扩展需要配合 wuzf/2fa 主程序使用。先按 GitHub 指南部署，再回到设置连接你的实例。</p>
					<div class="setup-actions">
						<a
							class="primary-button"
							href="https://github.com/wuzf/2fa/blob/main/docs/DEPLOYMENT.md"
							target="_blank"
							rel="noopener noreferrer"
							data-i18n="popupDeploymentGuide"
							>查看部署指南</a
						>
						<button id="setup-options" class="secondary-button" type="button" data-i18n="popupSetupOptions">已有实例，前往设置</button>
					</div>
				</section>

				<p id="account-warning" class="status" data-tone="notice" role="status" hidden></p>
				<section id="account-section" class="account-section" hidden>
					<div class="search-input-wrapper">
						<span id="search-icon" class="search-icon" aria-hidden="true"></span>
						<input
							id="account-search"
							class="account-search"
							type="search"
							placeholder="搜索服务或账户名称"
							data-i18n-placeholder="popupSearch"
							aria-label="搜索服务或账户名称"
							data-i18n-aria-label="popupSearch"
							aria-describedby="keyboard-help"
							autocomplete="off"
							autocorrect="off"
							autocapitalize="off"
							spellcheck="false"
						/>
						<button
							id="account-search-clear"
							class="search-clear"
							type="button"
							aria-label="清除搜索"
							data-i18n-aria-label="popupClearSearch"
							hidden
						></button>
						<span id="keyboard-help" hidden data-i18n="popupKeyboardFill">↑↓ 切换 · Enter 填充</span>
					</div>
					<div class="account-toolbar">
						<div class="account-scopes" aria-label="账户范围" data-i18n-aria-label="popupAccountScope">
							<button id="scope-site" type="button" class="scope-button" aria-pressed="true" data-i18n="popupSite">当前网站</button>
							<button id="scope-all" type="button" class="scope-button" aria-pressed="false" data-i18n="popupAll">全部账户</button>
						</div>
					</div>
					<p id="account-summary" class="account-summary" aria-live="polite"></p>
					<div id="accounts" class="account-list" aria-label="验证码账户" data-i18n-aria-label="popupAccounts"></div>
					<p id="account-empty" class="account-empty" hidden data-i18n="popupEmpty">没有找到匹配账户，请尝试服务名或账号的一部分。</p>
					<template id="account-card-template">
						<article class="account-card">
							<div
								class="progress-top"
								role="progressbar"
								aria-label="当前验证码剩余时间"
								data-i18n-aria-label="popupRemainingLabel"
								aria-valuemin="0"
								aria-valuemax="30"
								aria-valuenow="0"
								hidden
							>
								<div class="progress-top-fill"></div>
							</div>
							<div class="account-row">
								<div class="service-icon" aria-hidden="true">
									<img alt="" width="30" height="30" decoding="async" referrerpolicy="no-referrer" hidden /><span
										class="service-icon-fallback"
									></span>
								</div>
								<div class="account-info"><span class="account-name"></span><span class="account-detail"></span></div>
								<button
									class="account-favorite"
									type="button"
									aria-label="置顶常用账户"
									data-i18n-aria-label="popupPinAccount"
									aria-pressed="false"
								></button>
								<button class="account-fill" type="button" data-i18n="popupFill">填充</button>
							</div>
							<div class="code-preview">
								<div class="preview-current">
									<button
										class="preview-code"
										type="button"
										aria-label="复制当前验证码"
										data-i18n-aria-label="popupCopyCode"
										title="点击复制当前验证码"
										data-i18n-title="popupCopyCodeTitle"
										disabled
									>
										------
									</button>
									<span class="account-badge" hidden></span>
								</div>
								<p class="preview-status" role="status" hidden></p>
								<button class="preview-retry preview-link" type="button" hidden data-i18n="popupFetchAgain">重新获取</button>
								<div class="preview-next">
									<span data-i18n="popupNext">下一组</span
									><button
										class="preview-next-code"
										type="button"
										title="复制下一组验证码"
										data-i18n-title="popupCopyNext"
										aria-label="复制下一组验证码"
										data-i18n-aria-label="popupCopyNext"
										disabled
									>
										------</button
									><span class="preview-next-time" data-i18n="popupNotFetched">尚未获取</span>
								</div>
							</div>
						</article>
					</template>
				</section>

				<div id="actions" class="actions" hidden>
					<button id="open-source" class="primary-button" type="button" hidden data-i18n="popupOpenSource">打开 2FA</button>
					<button id="fill-focused" class="secondary-button" type="button" hidden data-i18n="popupFillFocused">填入已聚焦输入框</button>
					<button id="retry" class="secondary-button" type="button" data-i18n="popupRetry">重试</button>
				</div>
				<div class="fill-preferences" role="group" aria-label="账户记忆与自动填充" data-i18n-aria-label="popupPreferences">
					<label
						class="fill-preference"
						title="手动填充成功后记住此网站的账户，下次优先推荐；不会开启自动填充"
						data-i18n-title="popupRememberHint"
						hidden
					>
						<input id="remember-binding" type="checkbox" aria-labelledby="remember-title" aria-describedby="remember-description" />
						<span id="remember-title" data-i18n="popupRememberTitle">记住账户</span>
						<span id="remember-description" hidden data-i18n="popupRememberDescription"
							>手动填充成功后记住此网站的账户，下次优先推荐；不会开启自动填充。</span
						>
					</label>
					<label
						class="fill-preference"
						title="仅在此验证页面的相同路径自动检测并填码，无需打开扩展；多个匹配账户时需选择"
						data-i18n-title="popupAutofillHint"
						hidden
					>
						<input id="autofill-site" type="checkbox" aria-labelledby="autofill-title" aria-describedby="autofill-description" />
						<span id="autofill-title" data-i18n="popupAutofillTitle">在此页面自动填充</span>
						<span id="autofill-description" hidden data-i18n="popupAutofillDescription"
							>仅在此验证页面的相同路径自动检测并填码，无需打开扩展；多个匹配账户时需选择。</span
						>
					</label>
					<p id="autofill-note" class="fill-note" hidden data-i18n="popupAutofillHttpManual">
						这是 HTTP 页面，只能手动填充；每个账户的填充按钮仍可使用。
					</p>
				</div>
				<footer class="popup-footer">
					<details id="offline-state" class="offline-state" hidden>
						<summary id="offline-summary" aria-live="polite"></summary>
						<p id="offline-detail"></p>
					</details>
				</footer>
				<div id="copy-toast" class="copy-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
					<div class="toast-content">
						<span id="copy-toast-icon" class="toast-icon" aria-hidden="true"></span
						><span id="copy-toast-message" data-i18n="popupCopied">验证码已复制</span>
					</div>
				</div>
			</main>
		</div>

		<script type="module" src="popup.js"></script>
	</body>
</html>
