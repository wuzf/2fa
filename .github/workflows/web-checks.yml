name: Web checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-queue-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The page runs in the runner's Google Chrome when it has one, otherwise in this Chromium.
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Test the offline queue in a real browser
        run: npx playwright test --config tests/e2e/offline-queue.config.js

      - name: Save failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-offline-e2e
          path: test-results/web-offline/
          if-no-files-found: ignore
          retention-days: 14
